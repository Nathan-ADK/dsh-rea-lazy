# dsh-rea-lazy v2.0.0 — self-contained on-demand REA capability layer.
# Inserts our own plugin (no third-party capability-catalog needed).
# REA_COMMAND env / $DSH_HOME/.env overrides detection; otherwise PATH / local rea.mjs.
- insert:
    - id: dsh-rea-lazy
      name: '@nathan-adk/dsh-rea-lazy'
      config:
        idleDisconnectMs: 300000
        checkIntervalMs: 86400000
